name: easy_flavor
description: >-
  A CLI that sets up Flutter flavors (dev, staging, prod, ...) for Android and
  iOS in new or existing projects, with optional Firebase integration.
version: 0.1.0
repository: https://github.com/rokncode/easy_flavor
issue_tracker: https://github.com/rokncode/easy_flavor/issues
topics:
  - flutter
  - flavors
  - cli
  - firebase
  - build-variants

environment:
  sdk: ^3.8.0

executables:
  easy_flavor: easy_flavor

dependencies:
  args: ^2.7.0
  mason_logger: ^0.3.6
  meta: ^1.19.0
  path: ^1.9.1
  yaml: ^3.1.4
  yaml_edit: ^2.2.4

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
